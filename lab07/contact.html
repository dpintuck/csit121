<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Dave</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Provide Feedback</h1>
    <nav>
        <ul>
            <li><a href="tierlist.html">Tier List</a></li>
            <li><a href="contact.html" class="current">Provide Feedback</a></li>
        </ul>
    </nav>
    <form action="action_page.php" method="post">
        <div>
            <label for="FirstName">First Name:</label>
            <input type="text" id="FirstName" name="First Name" placeholder="First Name" required>
        </div>
        <br>
        <div>
            <label for="LastName">Last Name:</label>
            <input type="text" id="LastName" name="Last Name" placeholder="Last Name" required>
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="your email here">
        </div>
        <br>
        <div>
            <label for="msg">Provide Feedback:</label>
            <br>
            <textarea id="msg" name="msg" rows="10" cols="30" placeholder="Feedback..."></textarea>
        </div>
        <br>
        <input type="submit" value="Submit Feedback">
    </form>
</body>

</html>
