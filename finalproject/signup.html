    <h2>Pawsome Donate/Sign-Up Form</h2>
    <form action="action_page.php" method="post">
        <div>
            <label for="FirstName">First Name:</label>
            <input type="text" id="FirstName" name="First Name" placeholder="First Name" required>
        </div>
        <br>
        <div>
            <label for="LastName">Last Name:</label>
            <input type="text" id="LastName" name="Last Name" placeholder="Last Name" required>
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Your email here">
        </div>
        <h3>What are you contact us about?</h3>
        <div>
            <input type="checkbox" id="Donate" name="Donate" value="Donate">
            <label for="Donate">Donations</label>
        </div>
        <div>
            <input type="checkbox" id="Foster" name="Foster" value="Foster">
            <label for="Foster">Fostering</label>
        </div>
        <div>
            <input type="checkbox" id="Events" name="Events" value="Events">
            <label for="Events">Events</label>
        </div>
        <div>
            <input type="checkbox" id="Volunteer" name="Volunteer" value="Volunteer">
            <label for="Volunteer">Volunteering</label>
        </div>
        <br>
        <div>
            <label for="msg">Please provide details on what you are contact us about.</label>
            <br>
            <textarea id="msg" name="msg" rows="10" cols="60" placeholder="Details..."></textarea>
        </div>
        <br>
        <input type="submit" value="Submit Form">
    </form>
